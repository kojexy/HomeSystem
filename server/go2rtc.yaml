# go2rtc config — for the standalone go2rtc add-on (not the one built into HA,
# which HA manages and overwrites), or for server/docker-compose.yml, which uses
# a private copy: go2rtc.private.yaml. Web UI and API: http://<ha-ip>:1984
#
# Replace USER, PASSWORD and the IP with your camera's values.
# Never commit the real password — keep it only in the add-on's config.

streams:
  # Reolink (main stream, H.264). Many Reolink models also offer _sub for a lighter stream.
  front_door:
    - rtsp://USER:PASSWORD@192.168.1.50:554/h264Preview_01_main

  # Tapo example (enable "Camera account" in the Tapo app first):
  # front_door:
  #   - rtsp://USER:PASSWORD@192.168.1.50:554/stream1

  # Any ONVIF camera:
  # front_door:
  #   - onvif://USER:PASSWORD@192.168.1.50:2020

api:
  listen: ":1984"   # keep this port private to your home network
