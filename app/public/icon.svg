<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14263a"/>
      <stop offset="1" stop-color="#04070b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="56%" r="46%">
      <stop offset="0" stop-color="#5ce1e6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#5ce1e6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6f6f8"/>
      <stop offset="1" stop-color="#3cc4cf"/>
    </linearGradient>
    <radialGradient id="eye" cx="40%" cy="38%" r="70%">
      <stop offset="0" stop-color="#ffe2a8"/>
      <stop offset="1" stop-color="#ffb347"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>
  <rect x="3" y="3" width="506" height="506" rx="111" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="6"/>
  <!-- house -->
  <path d="M104 238 256 112l152 126" fill="none" stroke="url(#line)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M146 216v146a34 34 0 0 0 34 34h152a34 34 0 0 0 34-34V216" fill="none" stroke="url(#line)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- camera lens / eye: the home that sees -->
  <circle cx="256" cy="292" r="58" fill="#071019" stroke="url(#line)" stroke-width="22"/>
  <circle cx="256" cy="292" r="24" fill="url(#eye)"/>
  <circle cx="246" cy="282" r="7" fill="#ffffff" fill-opacity="0.85"/>
</svg>
