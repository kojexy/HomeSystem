# Builds the Android app (APK) on GitHub, so nothing has to be installed on the Mac.
# Get it: GitHub → Actions → "Android APK" → latest run → Artifacts → HomeSystem-apk.
name: Android APK

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npm test
      - run: npm run android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: app/android

      - uses: actions/upload-artifact@v4
        with:
          name: HomeSystem-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
