# Tests the app against a real Home Assistant (same version as the server kit),
# filled with HA's demo devices, and saves phone screenshots of the app connected to it.
name: Live test with Home Assistant

on:
  push:
    branches: [main]
    paths: ["app/src/**", "app/scripts/**", ".github/ci/live-ha/**", ".github/workflows/live-test.yml", "server/docker-compose.yml"]
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Start a pretend camera and Home Assistant
        run: |
          docker run -d --name camera --network host \
            -v $PWD/.github/ci/live-ha/mediamtx.yml:/mediamtx.yml:ro bluenviron/mediamtx:1.21.2-ffmpeg
          image=$(grep -oE 'ghcr.io/home-assistant/home-assistant:[^ ]+' server/docker-compose.yml)
          mkdir -p /tmp/ha && cp .github/ci/live-ha/configuration.yaml /tmp/ha/
          docker run -d --name ha --network host -v /tmp/ha:/config "$image"
          for i in $(seq 1 90); do curl -sf http://localhost:8123/api/onboarding >/dev/null && break; sleep 2; done
          curl -sf http://localhost:8123/api/onboarding

      - name: Create a test user and token (throwaway instance)
        run: |
          client=http://localhost:8123/
          password=$(openssl rand -hex 16)
          code=$(curl -sf -X POST http://localhost:8123/api/onboarding/users -H 'Content-Type: application/json' \
            -d "{\"client_id\":\"$client\",\"name\":\"CI\",\"username\":\"ci\",\"password\":\"$password\",\"language\":\"en\"}" | jq -r .auth_code)
          token=$(curl -sf -X POST http://localhost:8123/auth/token \
            -d "grant_type=authorization_code&code=$code&client_id=$client" | jq -r .access_token)
          echo "::add-mask::$token"
          echo "HA_TOKEN=$token" >> "$GITHUB_ENV"
          echo "HA_URL=http://localhost:8123" >> "$GITHUB_ENV"
          # Wait until the demo devices are there.
          for i in $(seq 1 60); do
            n=$(curl -sf -H "Authorization: Bearer $token" http://localhost:8123/api/states | jq length)
            [ "${n:-0}" -gt 50 ] && break; sleep 2
          done
          echo "Home Assistant has $n entities"

      - name: Add the camera the way a user does (Generic Camera, RTSP)
        run: |
          api() { curl -sf -X POST "http://localhost:8123/api/config/config_entries/$1" \
            -H "Authorization: Bearer $HA_TOKEN" -H 'Content-Type: application/json' -d "$2"; }
          flow=$(api flow '{"handler":"generic","show_advanced_options":false}' | jq -r .flow_id)
          api "flow/$flow" '{"stream_source":"rtsp://127.0.0.1:8554/test","advanced":{"framerate":2,"verify_ssl":false,"rtsp_transport":"tcp","authentication":"basic"}}' | jq -c '{step_id, errors}'
          api "flow/$flow" '{"confirmed_ok":true}' | jq -c '{type, title}'
          for i in $(seq 1 30); do
            cam=$(curl -sf -H "Authorization: Bearer $HA_TOKEN" http://localhost:8123/api/states \
              | jq -r '[.[] | select(.entity_id | startswith("camera.")) | select(.entity_id != "camera.demo_camera")][0].entity_id // empty')
            [ -n "$cam" ] && break; sleep 2
          done
          echo "Camera added: $cam"
          echo "HA_STREAM_CAMERA=$cam" >> "$GITHUB_ENV"

      - name: Live tests
        working-directory: app
        run: |
          npm ci
          npx vitest run src/live.test.ts --reporter verbose

      - name: Screenshots of the app connected to Home Assistant
        working-directory: app
        run: |
          npm run build
          npx vite preview --port 4173 --strictPort &
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chrome
          for i in $(seq 1 30); do curl -sf http://localhost:4173 >/dev/null && break; sleep 1; done
          mkdir -p screenshots
          APP_URL=http://localhost:4173 OUT=screenshots node scripts/screenshot-live.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-screenshots
          path: app/screenshots/
          if-no-files-found: ignore

      - name: Home Assistant log (on failure)
        if: failure()
        run: |
          docker logs ha 2>&1 | tail -80
          docker logs camera 2>&1 | tail -20
